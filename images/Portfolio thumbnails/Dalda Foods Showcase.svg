<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="daldaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2419"/>
      <stop offset="50%" stop-color="#143324"/>
      <stop offset="100%" stop-color="#08140D"/>
    </linearGradient>
    <radialGradient id="daldaGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E2B142" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#2D7A52" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="daldaGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadowD" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#daldaBg)"/>
  <rect width="1920" height="1080" fill="url(#daldaGlow)"/>

  <!-- Device Window Mockup -->
  <g filter="url(#shadowD)" transform="translate(260, 140)">
    <rect width="1400" height="800" rx="24" fill="#0E2117" stroke="rgba(226,177,66,0.3)" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect width="1400" height="56" rx="24" fill="#0A1811"/>
    <rect y="40" width="1400" height="16" fill="#0A1811"/>
    <circle cx="36" cy="28" r="6" fill="#FF5F56"/>
    <circle cx="58" cy="28" r="6" fill="#FFBD2E"/>
    <circle cx="80" cy="28" r="6" fill="#27C93F"/>
    
    <rect x="520" y="16" width="360" height="24" rx="12" fill="#152E20"/>
    <text x="700" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#B1D4C0" text-anchor="middle" letter-spacing="1.5">daldafoods.com · Brand Experience</text>

    <!-- Inner Screen -->
    <rect x="20" y="70" width="1360" height="710" rx="14" fill="#06120C"/>

    <!-- Header inside mockup -->
    <text x="70" y="130" font-family="'Outfit', sans-serif" font-size="32" font-weight="900" fill="#FCD34D" letter-spacing="2">DALDA</text>
    <text x="210" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="2">FOODS DIGITAL</text>

    <g transform="translate(560, 116)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FCD34D">Dalda Cooking Oil</text>
      <text x="160" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8BAA97">Manpasand</text>
      <text x="290" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8BAA97">CupShup Tea</text>
      <text x="420" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8BAA97">Knockout Snacks</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(80, 240)">
      <rect width="210" height="28" rx="14" fill="rgba(252,211,77,0.18)"/>
      <text x="105" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="1.5">70+ YEARS OF HERITAGE</text>
      
      <text x="0" y="90" font-family="'Outfit', sans-serif" font-size="50" font-weight="800" fill="#FFFFFF">
        <tspan x="0" dy="0">A Brand Experience</tspan>
        <tspan x="0" dy="56" fill="url(#daldaGold)">Built On Motherhood</tspan>
      </text>

      <text x="0" y="185" font-family="'Inter', sans-serif" font-size="15" fill="#A7C7B5">
        <tspan x="0" dy="0">Multi-brand architecture showcasing oils, teas, and snacks</tspan>
        <tspan x="0" dy="24">through an interactive 3D bottle and pack exploration shelf.</tspan>
      </text>

      <g transform="translate(0, 240)">
        <rect width="180" height="46" rx="23" fill="url(#daldaGold)"/>
        <text x="90" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#0A1811" text-anchor="middle">View Packaging 3D</text>
      </g>
    </g>

    <!-- Product Packs Representation Right -->
    <g transform="translate(760, 160)">
      <!-- Ground shadow ellipse -->
      <ellipse cx="280" cy="420" rx="260" ry="60" fill="#000" opacity="0.6"/>

      <!-- Oil Tin Left -->
      <g transform="translate(40, 100)">
        <rect width="140" height="280" rx="12" fill="#E2B142" stroke="#FFF" stroke-width="2"/>
        <rect x="15" y="30" width="110" height="220" rx="8" fill="#175033"/>
        <text x="70" y="70" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FCD34D" text-anchor="middle">DALDA</text>
        <text x="70" y="120" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">BANASPATI</text>
        <circle cx="70" cy="180" r="26" fill="#FCD34D"/>
        <text x="70" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#175033" text-anchor="middle">5 LITRE</text>
      </g>

      <!-- Center Gold Bottle (Hero) -->
      <g transform="translate(190, 40)" filter="url(#shadowD)">
        <!-- Bottle Cap -->
        <rect x="70" y="0" width="40" height="26" rx="6" fill="#D97706"/>
        <path d="M60 26 C60 50, 20 70, 20 120 L20 340 C20 355, 30 365, 45 365 L135 365 C150 365, 160 355, 160 340 L160 120 C160 70, 120 50, 120 26 Z" fill="#F59E0B" stroke="#FDE68A" stroke-width="2"/>
        <!-- Inner Label -->
        <rect x="35" y="130" width="110" height="180" rx="10" fill="#0D2E1F" stroke="#FCD34D" stroke-width="1.5"/>
        <text x="90" y="170" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#FCD34D" text-anchor="middle">DALDA</text>
        <text x="90" y="195" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CANOLA OIL</text>
        <circle cx="90" cy="240" r="22" fill="#FCD34D"/>
        <text x="90" y="246" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#0D2E1F" text-anchor="middle">VT-A&amp;D</text>
      </g>

      <!-- CupShup Right -->
      <g transform="translate(370, 120)">
        <rect width="130" height="240" rx="14" fill="#B91C1C" stroke="#FFF" stroke-width="2"/>
        <rect x="15" y="25" width="100" height="190" rx="8" fill="#FFF"/>
        <text x="65" y="65" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="middle">CupShup</text>
        <text x="65" y="90" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">PREMIUM TEA</text>
        <circle cx="65" cy="140" r="24" fill="#F59E0B"/>
      </g>
    </g>

    <!-- Bottom Metric Banner -->
    <g transform="translate(60, 690)">
      <rect width="1280" height="60" rx="12" fill="#081A11" stroke="rgba(252,211,77,0.18)" stroke-width="1"/>
      <text x="50" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FCD34D">5 Major Food Brands</text>
      <text x="360" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">12+ Pack Formats</text>
      <text x="690" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FCD34D">Interactive CSS 3D Shelf</text>
      <text x="1030" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">70+ Years Trusted</text>
    </g>
  </g>
</svg>
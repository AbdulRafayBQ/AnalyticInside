<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="rfbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191512"/>
      <stop offset="50%" stop-color="#261E19"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <radialGradient id="rfbGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#81B29A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rfbTerracotta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <filter id="shadowR" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#rfbBg)"/>
  <rect width="1920" height="1080" fill="url(#rfbGlow)"/>

  <!-- Device Window Mockup -->
  <g filter="url(#shadowR)" transform="translate(260, 140)">
    <rect width="1400" height="800" rx="24" fill="#1C1814" stroke="rgba(244,162,97,0.3)" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect width="1400" height="56" rx="24" fill="#13100D"/>
    <rect y="40" width="1400" height="16" fill="#13100D"/>
    <circle cx="36" cy="28" r="6" fill="#FF5F56"/>
    <circle cx="58" cy="28" r="6" fill="#FFBD2E"/>
    <circle cx="80" cy="28" r="6" fill="#27C93F"/>
    
    <rect x="520" y="16" width="360" height="24" rx="12" fill="#251E19"/>
    <text x="700" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#EAD5C3" text-anchor="middle" letter-spacing="1.5">realfoodblends.com · Nutrition Experience</text>

    <!-- Inner Screen -->
    <rect x="20" y="70" width="1360" height="710" rx="14" fill="#0C0A09"/>

    <!-- Header Inside -->
    <text x="70" y="130" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#F4A261" letter-spacing="1.5">REAL FOOD BLENDS</text>
    <text x="360" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#81B29A" letter-spacing="1.5">100% REAL FOOD MEALS</text>

    <g transform="translate(680, 116)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Meals &amp; Smoothies</text>
      <text x="160" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8B7E74">Ingredients</text>
      <text x="280" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8B7E74">Insurance Help</text>
    </g>

    <!-- Left Hero Copy -->
    <g transform="translate(80, 240)">
      <rect width="210" height="28" rx="14" fill="rgba(244,162,97,0.18)"/>
      <text x="105" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F4A261" text-anchor="middle" letter-spacing="1.5">CLINICAL &amp; WHOLE FOOD</text>
      
      <text x="0" y="90" font-family="'Outfit', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">
        <tspan x="0" dy="0">Real Food Presented</tspan>
        <tspan x="0" dy="56" fill="url(#rfbTerracotta)">With Depth &amp; Care</tspan>
      </text>

      <text x="0" y="185" font-family="'Inter', sans-serif" font-size="15" fill="#BFB1A5">
        <tspan x="0" dy="0">Showing honest ingredient profiles, clinical nutrition tables,</tspan>
        <tspan x="0" dy="24">and authentic product pouches for families and care teams.</tspan>
      </text>

      <g transform="translate(0, 240)">
        <rect width="180" height="46" rx="23" fill="url(#rfbTerracotta)"/>
        <text x="90" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#0E0C0A" text-anchor="middle">Explore Formulas →</text>
      </g>
    </g>

    <!-- Right Pouches Representation -->
    <g transform="translate(760, 160)">
      <ellipse cx="280" cy="420" rx="260" ry="60" fill="#000" opacity="0.6"/>

      <!-- Pouch Left (Orange/Salmon blend) -->
      <g transform="translate(40, 100) scale(0.88)">
        <rect width="180" height="270" rx="20" fill="#E76F51" stroke="#FFF" stroke-width="2"/>
        <rect x="20" y="30" width="140" height="210" rx="12" fill="#FBF8F3"/>
        <text x="90" y="70" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#2A1B14" text-anchor="middle">SALMON &amp; OATS</text>
        <circle cx="90" cy="120" r="22" fill="#E76F51"/>
        <text x="90" y="175" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#7A685D" text-anchor="middle">REAL FOOD MEAL</text>
      </g>

      <!-- Pouch Center (Hero Beef & Potato) -->
      <g transform="translate(180, 50)" filter="url(#shadowR)">
        <rect width="210" height="310" rx="22" fill="#81B29A" stroke="#FFF" stroke-width="2.5"/>
        <rect x="25" y="35" width="160" height="240" rx="14" fill="#FAF6EE"/>
        <text x="105" y="80" font-family="'Outfit', sans-serif" font-size="17" font-weight="900" fill="#1C2E24" text-anchor="middle">BEEF &amp; POTATOES</text>
        <circle cx="105" cy="135" r="26" fill="#81B29A"/>
        <text x="105" y="142" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">RFB</text>
        <text x="105" y="195" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#4B6657" text-anchor="middle">100% WHOLE INGREDIENTS</text>
        <text x="105" y="220" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#6A5C50" text-anchor="middle">Apples, Peas &amp; Flax Oil</text>
        <rect x="55" y="285" width="100" height="22" rx="11" fill="#264653"/>
        <text x="105" y="300" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFF" text-anchor="middle">NUTRITION FIRST</text>
      </g>

      <!-- Pouch Right (Smoothie) -->
      <g transform="translate(370, 110) scale(0.88)">
        <rect width="180" height="270" rx="20" fill="#F4A261" stroke="#FFF" stroke-width="2"/>
        <rect x="20" y="30" width="140" height="210" rx="12" fill="#FBF8F3"/>
        <text x="90" y="70" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#2A1B14" text-anchor="middle">BERRY SMOOTHIE</text>
        <circle cx="90" cy="120" r="22" fill="#F4A261"/>
        <text x="90" y="175" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#7A685D" text-anchor="middle">NATURAL FRUITS</text>
      </g>
    </g>

    <!-- Bottom Stat Strip -->
    <g transform="translate(60, 690)">
      <rect width="1280" height="60" rx="12" fill="#13100D" stroke="rgba(244,162,97,0.18)" stroke-width="1"/>
      <text x="50" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#F4A261">6 Complete Meals</text>
      <text x="360" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">100% Real Food Pouch</text>
      <text x="700" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#81B29A">Formula &amp; Tube-Feeding Ready</text>
      <text x="1060" y="35" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Zero Added Sugars</text>
    </g>
  </g>
</svg>